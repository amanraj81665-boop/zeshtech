<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Invoice | ZESH TECH</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a;font:15px/1.5 Arial,Helvetica,sans-serif}
    .wrap{max-width:760px;margin:32px auto;padding:0 16px}.brand{background:#0b1220;color:#fff;padding:22px 24px;border-radius:14px 14px 0 0}
    .brand strong{font-size:24px;letter-spacing:1px}.brand small{display:block;color:#cbd5e1;margin-top:4px}
    .paper{background:#fff;padding:24px;border-radius:0 0 14px 14px;box-shadow:0 8px 30px rgba(15,23,42,.08)}
    .meta{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}.muted{color:#64748b}
    .table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:480px}th,td{padding:11px 8px;border-bottom:1px solid #e2e8f0;text-align:left}
    th{font-size:12px;text-transform:uppercase;color:#64748b;background:#f8fafc}td.num,th.num{text-align:right}
    .totals{max-width:320px;margin:20px 0 0 auto}.line{display:flex;justify-content:space-between;padding:5px 0}.grand{font-size:20px;font-weight:800;border-top:1px solid #cbd5e1;margin-top:8px;padding-top:12px}
    .notice{padding:14px;background:#eff6ff;color:#1e40af;border-radius:10px}.error{background:#fff1f2;color:#9f1239}
    footer{text-align:center;color:#64748b;font-size:12px;margin:18px 0}@media(max-width:520px){.wrap{margin:12px auto}.paper{padding:16px}.brand{padding:18px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="brand"><strong>ZESH TECH</strong><small>Station Road, Bazidpur, Barh, Patna, Bihar 803213</small></header>
    <section class="paper" id="invoice-content"><div class="notice">Loading invoice details…</div></section>
    <footer>Thank you for shopping with ZESH TECH · <a href="https://www.zeshtech.in">www.zeshtech.in</a></footer>
  </main>
  <script src="/js/invoice.js?v=1"></script>
</body>
</html>
